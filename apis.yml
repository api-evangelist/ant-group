aid: ant-group
name: Ant Group
description: >-
  Ant Group is a Hangzhou-based fintech and technology company, operator of the
  Alipay digital payment and lifestyle super-app and parent of the Antom global
  merchant-payment business, the Alipay+ cross-border mobile-payment network,
  MYbank, and the ZOLOZ digital-identity platform. Its public developer surface is
  Antom (formerly Alipay Global), whose Alipay Merchant Services (AMS) REST API
  covers one-time payments, tokenized/auto-debit and subscription payments,
  refunds, captures, disputes, payouts, and 3-D Secure authentication across
  hundreds of global payment methods. Antom publishes first-party server SDKs
  (Java, Python, PHP, Go, .NET), a Web/WAP client SDK, a sandbox with a test
  dashboard and test wallet, RSA256 request signing, request-scoped idempotency,
  and dated release notes.
