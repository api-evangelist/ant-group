  - language: go
    registry: go
    name: github.com/alipay/global-open-sdk-go
    url: https://github.com/alipay/global-open-sdk-go
    install: go get github.com/alipay/global-open-sdk-go
    official: true
  - language: dotnet
    registry: github
    name: global-open-sdk-dotnet
    url: https://github.com/alipay/global-open-sdk-dotnet
    install: 'clone https://github.com/alipay/global-open-sdk-dotnet'
