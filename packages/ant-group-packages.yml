    registry: maven
    name: com.alipay.global.sdk:global-open-sdk-java
    url: https://github.com/alipay/global-open-sdk-java
    install: '<dependency><groupId>com.alipay.global.sdk</groupId><artifactId>global-open-sdk-java</artifactId></dependency>'
    official: true
  - language: python
    registry: pypi
    name: global-open-sdk-python
    url: https://pypi.org/project/global-open-sdk-python/
    install: pip install global-open-sdk-python
    official: true
  - language: php
    registry: packagist
    name: antom/global-open-sdk-php
    url: https://github.com/alipay/global-open-sdk-php
    install: composer require antom/global-open-sdk-php
