notes: >-
  Ant Group's global (Antom / Alipay Global) developer surface publishes
  first-party server and client SDKs under the github.com/alipay organization
  and language package registries. Client Web/WAP SDK is cited by the official
  docs llms.txt as the @alipay/antom-sdk npm package.
